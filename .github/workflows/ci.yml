name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu is x86-64; macos-latest runners are Apple silicon, which
        # exercises the AArch64 backend end to end.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make -j
      - name: Unit tests
        run: make unit
      - name: Language tests
        run: make test

  sanitize:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test under sanitizers
        run: make sanitize
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: |
          sudo apt-get install -y clang-format >/dev/null
          clang-format --dry-run --Werror $(find src runtime tests/unit -name '*.c' -o -name '*.h')
