name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu is x86-64; macos-latest runners are Apple silicon, which
        # exercises the AArch64 backend end to end.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make -j CFLAGS="-O2 -g -Werror -Wstrict-prototypes"
      - name: Unit tests
        run: make unit
      - name: Language tests
        run: make test
      - name: Examples
        run: make test-examples
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Language server integration tests
        run: make test-lsp

  sanitize:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test under sanitizers
        run: make sanitize
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Editor analysis under sanitizers
        run: |
          make lsp
          RIVELC="$PWD/bin/san/rivelc" RIVEL_TEST_COMPILER="$PWD/bin/san/rivelc" npm test --prefix tools/lsp
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: |
          sudo apt-get install -y clang-format >/dev/null
          clang-format --dry-run --Werror $(find src runtime tests/unit -name '*.c' -o -name '*.h')

  editor-support:
    name: Editor support
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install development tools
        run: npm ci --ignore-scripts
      - name: Test grammar and exported bundle
        run: npm test && npm run check:exports
      - name: Tree-sitter grammar
        working-directory: editors/tree-sitter-rivel
        run: |
          npm ci --ignore-scripts
          (cd node_modules/tree-sitter-cli && node install.js)
          npm run generate
          npm test
          git diff --exit-code -- src/
      - name: Zed adapter
        working-directory: editors/zed
        run: |
          rustup target add wasm32-wasip1
          cargo build --locked --target wasm32-wasip1
      - name: VS Code host integration
        working-directory: .
        run: |
          make lsp
          npm run build --prefix editors/vscode
          xvfb-run -a node editors/vscode/scripts/test-host.mjs
      - name: Package extension
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: rivel-editor-support
          path: |
            dist/*.vsix
            editors/textmate/Rivel.tmbundle/
            editors/zed/target/wasm32-wasip1/debug/rivel_zed.wasm
          if-no-files-found: error
